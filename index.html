  ctx.font = 'bold 9px Arial';
  ctx.textAlign = 'left';
  ctx.fillText(icon + ' ' + label.toUpperCase(), x + 10, y + 16);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.round(clamp(w*0.13, 12, 17)) + 'px Arial';
  ctx.fillText(value, x + 10, y + 38);
}

/* =========================================================
   REDEEM
   ========================================================= */
function tryRedeem(){
  let code = null;
  try { code = window.prompt('🎁 Enter redeem code (case-sensitive):', ''); } catch(e){}
  if(code === null) return;
  if(code === 'JATIN'){
    save.coins += 1000000;
    save.hasRedeemedLife = true;
    save.hasRedeemedBoost = true;
    persist();
    showToast('🎉 JATIN REDEEMED! +1,000,000 coins • +1 LIFE • Starting at 10,000 m!',
              '#ffcf26');
    setTimeout(() => { startRun('hard', 10000); }, 600);
  } else {
    showToast('❌ INVALID CODE', '#ff5252');
  }
}

/* =========================================================
   INPUT
   ========================================================= */
const activePointers = new Map();
function pointerPos(e){
  const r = canvas.getBoundingClientRect();
  return { x:e.clientX-r.left, y:e.clientY-r.top };
}
function hitTest(p){
  for(let i=uiButtons.length-1;i>=0;i--){
    const b = uiButtons[i];
    if(!b.enabled) continue;
    if(p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h) return b.id;
  }
  return null;
}
function onDown(e){
  Audio.resume();
  Audio.init();
  if((screenMode === 'menu' || screenMode === 'garage' || screenMode === 'profile' || screenMode === 'maps') && !Audio.musicPlaying && !Audio.muted){
    Audio.startMusic();
  }
  const p = pointerPos(e);

  /* Maps screen: start drag scroll */
  if(screenMode === 'maps'){
    mapsDrag = {
      startY: p.y,
      startX: p.x,
      startScroll: mapsScroll,
      moved: false,
      pointerId: e.pointerId
    };
    return;
  }

  if(screenMode !== 'game'){
    const id = hitTest(p);
    if(id) navAction(id);
    return;
  }
  if(world.over){
    const id = hitTest(p);
    if(id) gameAction(id);
    return;
  }
  const id = hitTest(p);
  if(id === 'nitro'){ activateNitro(); return; }
  if(id === 'pause'){ paused = !paused; return; }
  if(p.x > W-80 && p.y < 72){ paused = !paused; return; }
  if(paused) return;
  if(p.y > H*0.60){
    if(p.x < W/2){ input.brake = true; activePointers.set(e.pointerId,'brake'); }
    else         { input.gas   = true; activePointers.set(e.pointerId,'gas');   }
  }
}
function onMove(e){
  /* Maps drag scroll */
  if(mapsDrag && mapsDrag.pointerId === e.pointerId){
    const p = pointerPos(e);
    const dy = p.y - mapsDrag.startY;
    const dx = p.x - mapsDrag.startX;
    if(Math.abs(dy) > 6 || Math.abs(dx) > 6) mapsDrag.moved = true;
    mapsScroll = clamp(mapsDrag.startScroll - dy, 0, mapsScrollMax);
  }
}
function onUp(e){
  /* Handle maps drag release */
  if(mapsDrag && mapsDrag.pointerId === e.pointerId){
    if(!mapsDrag.moved){
      /* Treat as tap */
      const p = pointerPos(e);
      const id = hitTest(p);
      if(id) navAction(id);
    }
    mapsDrag = null;
    return;
  }
  const role = activePointers.get(e.pointerId);
  if(role === 'gas')   input.gas = false;
  if(role === 'brake') input.brake = false;
  activePointers.delete(e.pointerId);
}
canvas.addEventListener('pointerdown', e=>{
  e.preventDefault();
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  onDown(e);
}, {passive:false});
canvas.addEventListener('pointermove', e=>{
  if(mapsDrag) e.preventDefault();
  onMove(e);
}, {passive:false});
canvas.addEventListener('pointerup', e=>{ e.preventDefault(); onUp(e); }, {passive:false});
canvas.addEventListener('pointercancel', e=>{ onUp(e); });
canvas.addEventListener('pointerleave', e=>{ onUp(e); });

/* Mouse wheel for map scrolling */
canvas.addEventListener('wheel', e=>{
  if(screenMode === 'maps'){
    e.preventDefault();
    mapsScroll = clamp(mapsScroll + e.deltaY, 0, mapsScrollMax);
  }
}, {passive:false});

/* Touch scroll fallback (prevent page bounce on maps screen) */
canvas.addEventListener('touchmove', e=>{
  if(screenMode === 'maps') e.preventDefault();
}, {passive:false});

window.addEventListener('keydown', e=>{
  Audio.resume();
  Audio.init();
  if((screenMode === 'menu' || screenMode === 'garage' || screenMode === 'profile' || screenMode === 'maps') && !Audio.musicPlaying && !Audio.muted){
    Audio.startMusic();
  }
  if(e.code==='ArrowRight'||e.code==='KeyD'){ input.gas = true; e.preventDefault(); }
  if(e.code==='ArrowLeft' ||e.code==='KeyA'){ input.brake = true; e.preventDefault(); }
  if(e.code==='KeyN' || e.code==='ShiftLeft'){
    e.preventDefault();
    if(screenMode==='game' && !world.over && !paused) activateNitro();
  }
  if(e.code==='Space'){
    e.preventDefault();
    if(screenMode==='game' && !world.over) paused = !paused;
  }
  if(e.code==='Escape'){
    if(screenMode === 'game'){ screenMode='menu'; input.gas=false; input.brake=false; paused=false; Audio.stopBrake(); brakeSoundActive=false; }
    else if(screenMode === 'garage' || screenMode === 'profile' || screenMode === 'maps') screenMode = 'menu';
  }
  if(screenMode === 'maps'){
    if(e.code==='ArrowDown' || e.code==='PageDown'){
      mapsScroll = clamp(mapsScroll + 120, 0, mapsScrollMax); e.preventDefault();
    } else if(e.code==='ArrowUp' || e.code==='PageUp'){
      mapsScroll = clamp(mapsScroll - 120, 0, mapsScrollMax); e.preventDefault();
    } else if(e.code==='Home'){
      mapsScroll = 0; e.preventDefault();
    } else if(e.code==='End'){
      mapsScroll = mapsScrollMax; e.preventDefault();
    }
  }
  if(screenMode === 'garage'){
    if(e.code==='ArrowRight'){ save.selected=(save.selected+1)%VEHICLES.length; persist(); }
    if(e.code==='ArrowLeft'){ save.selected=(save.selected-1+VEHICLES.length)%VEHICLES.length; persist(); }
  }
});
window.addEventListener('keyup', e=>{
  if(e.code==='ArrowRight'||e.code==='KeyD') input.gas = false;
  if(e.code==='ArrowLeft' ||e.code==='KeyA') input.brake = false;
});

const muteBtn = document.getElementById('muteBtn');
muteBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const muted = Audio.toggleMute();
  muteBtn.textContent = muted ? '🔇 UNMUTE' : '🔊 MUTE';
});

/* =========================================================
   NAVIGATION
   ========================================================= */
function navAction(id){
  Audio.click();
  if(id === 'openGarage' || id === 'openProfile' || id === 'backMenu' || id === 'openMaps'){
    if(!Audio.musicPlaying && !Audio.muted) Audio.startMusic();
  }

  if(id === 'openGarage'){ screenMode = 'garage'; return; }
  if(id === 'openProfile'){ screenMode = 'profile'; emojiPickerOpen = false; return; }
  if(id === 'openMaps'){ screenMode = 'maps'; mapsScroll = 0; mapsDrag = null; return; }
  if(id === 'backMenu'){ screenMode = 'menu'; emojiPickerOpen = false; mapsDrag = null; return; }
  if(id === 'prev'){ save.selected=(save.selected-1+VEHICLES.length)%VEHICLES.length; persist(); return; }
  if(id === 'next'){ save.selected=(save.selected+1)%VEHICLES.length; persist(); return; }

  if(id === 'buy'){
    const v = VEHICLES[save.selected];
    if(!save.owned[save.selected] && save.coins >= v.price){
      save.coins -= v.price;
      save.owned[save.selected] = true;
      persist();
      showToast('✔ Purchased ' + v.name, '#57d94a');
    }
    return;
  }

  if(id === 'drive'){
    if(!save.owned[save.selected]){
      showToast('🔒 Buy this vehicle first!', '#ff5252');
      return;
    }
    startRun(save.difficultyId || 'medium');
    return;
  }

  if(id.indexOf('sel_') === 0){
    const i = parseInt(id.slice(4),10);
    if(!isNaN(i)){ save.selected = i; persist(); }
    return;
  }

  if(id.indexOf('upg_') === 0){
    const key = id.slice(4);
    const u = UPGRADES.find(x=>x.id===key);
    if(!u) return;
    const lv = save.upgrades[key];
    if(lv >= u.max) return;
    const cost = upgradeCost(key, lv);
    if(save.coins >= cost){
      save.coins -= cost;
      save.upgrades[key] = lv + 1;
      persist();
    }
    return;
  }

  if(id.indexOf('map_') === 0){
    const i = parseInt(id.slice(4),10);
    if(isNaN(i) || !SEASONS[i]) return;
    const s = SEASONS[i];
    if(save.ownedMaps[i]){
      save.selectedMap = i;
      currentSeason = s;
      persist();
      showToast('🗺️ ' + s.icon + ' ' + s.name + ' selected', '#57d94a');
    } else {
      if(save.coins >= s.price){
        save.coins -= s.price;
        save.ownedMaps[i] = true;
        save.selectedMap = i;
        currentSeason = s;
        persist();
        showToast('🎉 Unlocked ' + s.icon + ' ' + s.name + '!', '#ffcf26');
      } else {
        showToast('❌ Need ' + s.price.toLocaleString() + ' coins', '#ff5252');
      }
    }
    return;
  }

  if(id === 'editName'){
    let nm = null;
    try { nm = window.prompt('Enter your name (max 18 chars):', save.profile.name); } catch(e){}
    if(nm !== null){
      const clean = nm.trim().slice(0,18) || 'Racer';
      save.profile.name = clean;
      persist();
    }
    return;
  }
  if(id === 'editEmoji'){ emojiPickerOpen = !emojiPickerOpen; return; }
  if(id.indexOf('emoji_') === 0){
    const i = parseInt(id.slice(6),10);
    if(!isNaN(i) && AVATAR_EMOJIS[i]){
      save.profile.emoji = AVATAR_EMOJIS[i];
      persist();
    }
    return;
  }
  if(id === 'cycleBot'){
    const idx = BOT_MODES.findIndex(m=>m.id === save.botMode);
    const next = BOT_MODES[(idx + 1) % BOT_MODES.length];
    save.botMode = next.id;
    persist();
    showToast('🤖 ' + next.name, '#4ad1ff');
    return;
  }
  if(id === 'openRedeem' || id === 'openRedeem2'){
    tryRedeem();
    return;
  }
  if(id.indexOf('diff_') === 0){
    const dId = id.slice(5);
    if(DIFFICULTIES[dId]){
      save.difficultyId = dId;
      startRun(dId);
    }
    return;
  }
}

function gameAction(id){
  if(id === 'retry'){
    if(!save.owned[save.selected]){
      for(let i=0;i<save.owned.length;i++) if(save.owned[i]){ save.selected = i; break; }
      persist();
    }
    startRun(world.difficultyId);
  } else if(id === 'garage'){
    screenMode = 'garage';
    input.gas = false; input.brake = false; paused = false;
    Audio.stopBrake(); brakeSoundActive = false;
  }
}

/* =========================================================
   HINT
   ========================================================= */
const hintEl = document.getElementById('hint');
let hintHidden = false;
function hideHint(){
  if(hintHidden) return;
  hintHidden = true;
  hintEl.style.opacity = '0';
  setTimeout(()=>{ hintEl.style.display='none'; }, 700);
}
setTimeout(hideHint, 8000);

/* =========================================================
   LOOP
   ========================================================= */
function updateCamera(dt){
  const car = world.car;
  if(!car) return;
  const tx = car.x - W*0.30;
  const ty = car.y - H*0.56;
  const rate = world.nitro.active ? 0.00004 : 0.0015;
  const rateY = world.nitro.active ? 0.002 : 0.05;
  cam.x = lerp(cam.x, tx, 1 - Math.pow(rate, dt));
  cam.y = lerp(cam.y, ty, 1 - Math.pow(rateY, dt));
}
function updateGame(dt){
  if(world.car){
    generateAhead(world.car.x + W + 2200);
    cullObjects(world.car.x);
  }
  if(!paused && !world.over){
    acc += dt;
    let steps = 0;
    while(acc >= FIXED && steps < 14){
      physicsStep(FIXED);
      acc -= FIXED;
      steps++;
    }
    if(steps >= 14) acc = 0;
  }
  if(world.bot && !paused) updateBot(dt);
  updateParticles(dt);
  updateCamera(dt);
  if(world.shake > 0) world.shake = Math.max(0, world.shake - dt*32);
  if(toast){ toast.life -= dt; if(toast.life <= 0) toast = null; }
}
function renderGame(){
  ctx.save();
  if(world.shake > 0){
    ctx.translate((Math.random()-0.5)*world.shake, (Math.random()-0.5)*world.shake);
  }
  drawSky();
  if(currentSeason.id !== 'cave'){
    drawClouds();
    drawBirds();
  }
  if(currentSeason.id === 'cave'){
    drawCaveCeiling();
  }
  drawFallingLeaves();
  drawParallaxHills();
  ctx.save();
  ctx.translate(-cam.x, -cam.y);
  drawScenery();
  drawTerrain();
  drawObjects();
  drawBotCar();
  drawCar();
  drawParticles();
  ctx.restore();
  ctx.restore();
  drawNightTint();
  ctx.save();
  ctx.translate(-cam.x, -cam.y);
  drawHeadlights();
  ctx.restore();
  drawRain();
  drawNitroOverlay();
  drawGameHUD();

  if(world.captureNextFrame){
    try {
      const snap = canvas.toDataURL('image/jpeg', 0.55);
      const img = new Image();
      img.src = snap;
      world.crashImg = img;
    } catch(err){}
    world.captureNextFrame = false;
  }

  if(paused && !world.over){
    ctx.fillStyle = 'rgba(0,0,0,0.58)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 46px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', W/2, H/2-8);
    ctx.font = 'bold 15px Arial';
    ctx.fillStyle = '#9fb0c0';
    ctx.fillText('Tap pause or press SPACE to resume', W/2, H/2+30);
    ctx.textAlign = 'left';
  }
  if(world.over) drawGameOver();
}
function loop(now){
  const dt = Math.min((now - lastT)/1000, 0.05);
  lastT = now;
  if(screenMode === 'menu') drawMenu(now/1000);
  else if(screenMode === 'garage') drawGarage(now/1000);
  else if(screenMode === 'profile') drawProfile(now/1000);
  else if(screenMode === 'maps') drawMaps(now/1000);
  else { updateGame(dt); renderGame(); }
  requestAnimationFrame(loop);
}
lastT = performance.now();
requestAnimationFrame(loop);

})();
</script>
