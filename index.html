/* =========================================================
   AUDIO ENGINE
   ========================================================= */
const Audio = {
  ctx: null, masterGain: null, musicGain: null, sfxGain: null,
  musicTimer: null, musicPlaying: false, muted: false,
  brakeOsc: null, brakeGain: null, brakeActive: false,
  initialized: false,

  init(){
    if(this.initialized) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      this.ctx = new AC();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = 0.85;
      this.masterGain.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.42;
      this.musicGain.connect(this.masterGain);
      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = 1.0;
      this.sfxGain.connect(this.masterGain);
      this.initialized = true;
    } catch(e){ this.ctx = null; }
  },

  resume(){ if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },

  startMusic(){
    this.init();
    if(!this.ctx || this.musicPlaying || this.muted) return;
    this.musicPlaying = true;
    const chords = [
      [220.00, 261.63, 329.63],
      [174.61, 220.00, 261.63],
      [261.63, 329.63, 392.00],
      [196.00, 246.94, 293.66]
    ];
    const bassNotes = [110.00, 87.31, 130.81, 98.00];
    const arpNotes = [
      [440.00, 523.25, 659.25, 523.25],
      [349.23, 440.00, 523.25, 440.00],
      [523.25, 659.25, 783.99, 659.25],
      [392.00, 493.88, 587.33, 493.88]
    ];
    const tempo = 0.55;
    const beatsPerChord = 4;
    let chordIdx = 0, beatIdx = 0;

    const playBeat = () => {
      if(!this.musicPlaying || !this.ctx || this.muted) return;
      const now = this.ctx.currentTime;
      if(beatIdx === 0){
        for(const freq of chords[chordIdx]){
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          g.gain.setValueAtTime(0, now);
          g.gain.linearRampToValueAtTime(0.07, now + 0.15);
          g.gain.linearRampToValueAtTime(0.05, now + tempo*beatsPerChord*0.7);
          g.gain.linearRampToValueAtTime(0, now + tempo*beatsPerChord);
          osc.connect(g); g.connect(this.musicGain);
          osc.start(now); osc.stop(now + tempo*beatsPerChord + 0.05);
        }
      }
      const bassOsc = this.ctx.createOscillator();
      const bassG = this.ctx.createGain();
      bassOsc.type = 'triangle';
      bassOsc.frequency.value = bassNotes[chordIdx];
      bassG.gain.setValueAtTime(0, now);
      bassG.gain.linearRampToValueAtTime(0.16, now + 0.02);
      bassG.gain.exponentialRampToValueAtTime(0.001, now + tempo*0.9);
      bassOsc.connect(bassG); bassG.connect(this.musicGain);
      bassOsc.start(now); bassOsc.stop(now + tempo);

      const arpFreq = arpNotes[chordIdx][beatIdx];
      const arpOsc = this.ctx.createOscillator();
      const arpG = this.ctx.createGain();
      arpOsc.type = 'sine';
      arpOsc.frequency.value = arpFreq;
      arpG.gain.setValueAtTime(0, now);
      arpG.gain.linearRampToValueAtTime(0.09, now + 0.02);
      arpG.gain.exponentialRampToValueAtTime(0.001, now + tempo*0.8);
      arpOsc.connect(arpG); arpG.connect(this.musicGain);
      arpOsc.start(now); arpOsc.stop(now + tempo);

      if(beatIdx % 2 === 1){
        const bufSize = Math.floor(this.ctx.sampleRate * 0.06);
        const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufSize);
        const src = this.ctx.createBufferSource();
        src.buffer = buf;
        const hp = this.ctx.createBiquadFilter();
        hp.type = 'highpass'; hp.frequency.value = 7000;
        const hg = this.ctx.createGain(); hg.gain.value = 0.10;
        src.connect(hp); hp.connect(hg); hg.connect(this.musicGain);
        src.start(now);
      }
      beatIdx++;
      if(beatIdx >= beatsPerChord){ beatIdx = 0; chordIdx = (chordIdx+1)%chords.length; }
      this.musicTimer = setTimeout(playBeat, tempo * 1000);
    };
    playBeat();
  },

  stopMusic(){
    this.musicPlaying = false;
    if(this.musicTimer){ clearTimeout(this.musicTimer); this.musicTimer = null; }
  },

  startBrake(){
    this.init();
    if(!this.ctx || this.muted || this.brakeActive) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = 'sawtooth'; osc.frequency.value = 2400;
    const osc2 = this.ctx.createOscillator();
    osc2.type = 'square'; osc2.frequency.value = 1820;
    const bufSize = Math.floor(this.ctx.sampleRate * 0.5);
    const noiseBuf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for(let i=0;i<bufSize;i++) nd[i] = Math.random()*2-1;
    const noiseSrc = this.ctx.createBufferSource();
    noiseSrc.buffer = noiseBuf; noiseSrc.loop = true;
    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 2200; bp.Q.value = 6;
    const bp2 = this.ctx.createBiquadFilter();
    bp2.type = 'bandpass'; bp2.frequency.value = 3200; bp2.Q.value = 8;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(0.85, now + 0.02);
    osc.connect(bp); bp.connect(g);
    osc2.connect(bp2); bp2.connect(g);
    noiseSrc.connect(g);
    g.connect(this.sfxGain);
    osc.start(now); osc2.start(now); noiseSrc.start(now);
    this.brakeOsc = { osc, osc2, noiseSrc, bp, bp2 };
    this.brakeGain = g;
    this.brakeActive = true;
  },

  updateBrake(intensity){
    if(!this.ctx || !this.brakeActive) return;
    const now = this.ctx.currentTime;
    const t = Math.max(0, Math.min(1, intensity));
    if(this.brakeGain) this.brakeGain.gain.setTargetAtTime(0.6 + t*0.35, now, 0.03);
    if(this.brakeOsc){
      const baseFreq = 2100 + t * 900 + Math.sin(now*22)*120;
      this.brakeOsc.osc.frequency.setTargetAtTime(baseFreq, now, 0.02);
      this.brakeOsc.osc2.frequency.setTargetAtTime(baseFreq*0.76, now, 0.02);
      this.brakeOsc.bp.frequency.setTargetAtTime(baseFreq*0.95, now, 0.02);
      this.brakeOsc.bp2.frequency.setTargetAtTime(baseFreq*1.35, now, 0.02);
    }
  },

  stopBrake(){
    if(!this.ctx || !this.brakeActive) return;
    const now = this.ctx.currentTime;
    if(this.brakeGain) this.brakeGain.gain.setTargetAtTime(0, now, 0.04);
    const osc = this.brakeOsc;
    setTimeout(()=>{
      try {
        if(osc){
          osc.osc.stop(); osc.osc2.stop(); osc.noiseSrc.stop();
          osc.osc.disconnect(); osc.osc2.disconnect(); osc.noiseSrc.disconnect();
          osc.bp.disconnect(); osc.bp2.disconnect();
        }
      } catch(e){}
    }, 120);
    this.brakeOsc = null; this.brakeGain = null; this.brakeActive = false;
  },

  crash(){
    this.init();
    if(!this.ctx || this.muted) return;
    const now = this.ctx.currentTime;
    const bufSize = Math.floor(this.ctx.sampleRate * 0.5);
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufSize, 2);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1600;
    const g = this.ctx.createGain(); g.gain.value = 0.9;
    src.connect(lp); lp.connect(g); g.connect(this.sfxGain);
    src.start(now);
  },

  coin(){
    this.init();
    if(!this.ctx || this.muted) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1200, now);
    osc.frequency.exponentialRampToValueAtTime(1800, now + 0.08);
    g.gain.setValueAtTime(0.18, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    osc.connect(g); g.connect(this.sfxGain);
    osc.start(now); osc.stop(now + 0.15);
  },

  click(){
    this.init();
    if(!this.ctx || this.muted) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(800, now);
    osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
    g.gain.setValueAtTime(0.12, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
    osc.connect(g); g.connect(this.sfxGain);
    osc.start(now); osc.stop(now + 0.08);
  },

  toggleMute(){
    this.muted = !this.muted;
    if(this.masterGain) this.masterGain.gain.setTargetAtTime(this.muted ? 0 : 0.85, this.ctx.currentTime, 0.05);
    if(this.muted){ this.stopMusic(); this.stopBrake(); }
    else if(screenMode !== 'game'){ this.startMusic(); }
    return this.muted;
  }
};

/* =========================================================
   HELPERS
   ========================================================= */
const TAU = Math.PI*2;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
function hash(n){ const s=Math.sin(n*127.1)*43758.5453; return s-Math.floor(s); }
function hash2(n){ const s=Math.sin(n*311.7+7.13)*43758.5453; return s-Math.floor(s); }
function rr(x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function mixC(c1,c2,t){
  return [Math.round(lerp(c1[0],c2[0],t)),
          Math.round(lerp(c1[1],c2[1],t)),
          Math.round(lerp(c1[2],c2[2],t))];
}
function rgb(c,a){
  return a===undefined ? `rgb(${c[0]},${c[1]},${c[2]})`
                       : `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}
function hexToRgb(h){
  h = h.replace('#','');
  if(h.length === 3) h = h.split('').map(c=>c+c).join('');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}

function getRank(dist){
  let rank = null;
  for(const r of RANKS){ if(dist >= r.min) rank = r; }
  return rank;
}
function getNextRank(dist){
  for(const r of RANKS){ if(dist < r.min) return r; }
  return null;
}

  { id:'grip',   name:'GRIP',   baseCost: 2000, max:5 },
  { id:'fuel',   name:'FUEL',   baseCost: 1800, max:5 },
  { id:'nitro',  name:'NITRO',  baseCost: 3500, max:5 }
];
function upgradeCost(id, level){
  const u = UPGRADES.find(x=>x.id===id);
  return Math.floor(u.baseCost * Math.pow(level+1, 2.1));
}
function engMul(){ return 1 + save.upgrades.engine * 0.20; }
function gripMul(){ return 1 + save.upgrades.grip   * 0.14; }
function fuelMul(){ return 1 + save.upgrades.fuel   * 0.18; }
function nitroDur(){ return 3.6 + save.upgrades.nitro * 0.55; }
function nitroPow(){ return 2600 + save.upgrades.nitro * 620; }

/* =========================================================
   TERRAIN
   ========================================================= */
const START_X = 150;
const PX_PER_M = 10;
let terrainMul = 1;
let currentSeason = SEASONS[0];

function terrainY(x){
  const s  = clamp((x-150)/540, 0, 1);
  const sm = s*s*(3-2*s);
  const d  = (1 + Math.min(x/42000, 1.0)) * terrainMul;
  const h = Math.sin(x*0.0072)*58*d
          + Math.sin(x*0.0158+1.3)*24*d
          + Math.sin(x*0.0031)*80*terrainMul
          + Math.sin(x*0.0402+2.2)*6*d
          + Math.sin(x*0.00087)*120;
  return -40 + h*sm;
}
function terrainSlope(x){
  return (terrainY(x+3) - terrainY(x-3)) / 6;
}

/* =========================================================
   WORLD OBJECTS
   ========================================================= */
const objects = [];
let genX = 520;
let lastFuelX = -9999;
let coinMul = 1;
function coinValue(x){
  const tier = Math.floor(x/6000);
  if(tier >= 6) return 250;
  if(tier >= 4) return 100;
  if(tier >= 2) return 25;
  if(tier >= 1) return 10;
  return 5;
}
function generateAhead(untilX){
  while(genX < untilX){
    const r = hash(genX*0.0131);
    if(r < 0.82){
      const n = 1 + Math.floor(hash(genX*0.041)*4);
      const arc = hash(genX*0.077) > 0.72;
      for(let i=0;i<n;i++){
        const x = genX + i*44;
        const baseY = terrainY(x);
        const lift  = arc ? Math.sin(i/(n-1||1)*Math.PI)*70 : hash(x*0.31)*52;
        const v = Math.max(1, Math.round(coinValue(x) * coinMul));
        objects.push({ type:'coin', x, y: baseY - 62 - lift, v, got:false, ph: hash(x*0.9)*10 });
      }
    }
    if(genX - lastFuelX > 2300 && hash(genX*0.0071) > 0.55){
      const x = genX + 40;
      objects.push({ type:'fuel', x, y: terrainY(x)-56, got:false, ph: hash(x)*10 });
      lastFuelX = x;
    }
    genX += 150;
  }
}
function cullObjects(carX){
  for(let i=objects.length-1;i>=0;i--){
    if(objects[i].x < carX - 900) objects.splice(i,1);
  }
}

/* =========================================================
   PARTICLES
   ========================================================= */
const parts = [];
function spawn(x,y,vx,vy,life,size,color,grav){
  if(parts.length > 700) return;
  parts.push({x,y,vx,vy,life,max:life,size,color,grav:grav||0});
}
function updateParticles(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.life -= dt;
    if(p.life <= 0){ parts.splice(i,1); continue; }
    p.vy += p.grav*dt;
    p.x += p.vx*dt;
    p.y += p.vy*dt;
  }
}
function drawParticles(){
  for(const p of parts){
    const t = p.life/p.max;
    ctx.globalAlpha = t*0.85;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size*(0.35 + t*0.9), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

  const w0 = def.wheels[0];
  return {
    def, x: startX,
    y: terrainY(startX) - (w0.ly + w0.r) - 6,
    vx:0, vy:0, a:0, av:0,
    spin: def.wheels.map(()=>0),
    grounded:0, squash: 0, wheelie: 0

}

function startRun(diffId, startOffsetMeters){
  Audio.stopMusic();
  Audio.stopBrake();
  brakeSoundActive = false;

  /* FIX: Only use a vehicle we actually own */
  let usableIdx = save.selected;
  if(!save.owned[usableIdx]){
    for(let i=0;i<save.owned.length;i++){
      if(save.owned[i]){ usableIdx = i; break; }
    }
    save.selected = usableIdx;
    persist();
  }

  const D = DIFFICULTIES[diffId] || DIFFICULTIES.medium;
  world.difficultyId = diffId;
  terrainMul = D.terrainMul;
  coinMul = D.coinMul;
  if(D.startBonus) save.coins += D.startBonus;

  currentSeason = SEASONS[save.selectedMap] || SEASONS[0];

  const offsetM = startOffsetMeters || 0;
  const startX = START_X + offsetM * PX_PER_M;
  world.startOffsetMeters = offsetM;

  const def = VEHICLES[usableIdx];
  world.car = makeCar(def, startX);
  world.maxFuel = def.fuelMax * fuelMul();
  world.fuel = world.maxFuel;
  world.distance = offsetM;
  world.level = Math.floor(offsetM/250) + 1;
  world.topSpeed = 0;
  world.over = false;
  world.reason = '';
  world.shake = 0;
  world.coinsEarned = 0;
  world.crashImg = null;
  world.captureNextFrame = false;
  world.freeReviveUsedThisMatch = false;
  world.revivesThisRun = 0;
  world.livesLeft = save.hasRedeemedLife ? 1 : 0;
  world.nitro = {
    active:false, timer:0, used:false,
    duration: nitroDur(), power: nitroPow()
  };

  const botMode = BOT_MODES.find(m=>m.id === save.botMode) || BOT_MODES[0];
  if(botMode.speedMul > 0){
    world.bot = makeBot();
    world.bot.speedMul = botMode.speedMul;
    if(offsetM > 0){
      world.bot.x = startX - 140 - Math.random()*40;
      const w0 = world.bot.def.wheels[0];
      world.bot.y = terrainY(world.bot.x) - (w0.ly + w0.r) - 6;
    }
  } else {
    world.bot = null;
  }

  objects.length = 0;
  parts.length = 0;
  genX = startX + 400;
  lastFuelX = startX - 2000;
  generateAhead(startX + W + 1600);

  cam.x = world.car.x - W*0.30;
  cam.y = world.car.y - H*0.55;

  acc = 0; paused = false;
  input.gas = false; input.brake = false;
  nightness = 0;

  save.matchesPlayed++;
  persist();

  screenMode = 'game';
  hideHint();
}

function activateNitro(){
  if(!world.car || world.over || paused) return;
  if(world.nitro.used) return;
  world.nitro.used = true;
  world.nitro.active = true;
  world.nitro.timer = world.nitro.duration;
  world.shake = 14;
  const c = world.car;
  for(let i=0;i<40;i++){
    const a = Math.random()*TAU;
    spawn(c.x, c.y, Math.cos(a)*300 + c.vx*0.2, Math.sin(a)*300,
          0.7, 4+Math.random()*6, 'rgba(120,220,255,0.9)', 200);
  }
}

function reviveRun(kind){
  const car = world.car;
  if(!car) return;
  const gy = terrainY(car.x);
  car.vy = -280;
  car.vx = Math.max(car.vx, 180);
  car.y = gy - 110;
  car.a = 0; car.av = 0; car.squash = 0;
  world.fuel = world.maxFuel;
  world.over = false;
  world.reason = '';
  world.shake = 10;
  paused = false;
  world.revivesThisRun++;
  for(let k=0;k<24;k++){
    const a = Math.random()*TAU;
    spawn(car.x, car.y, Math.cos(a)*200, Math.sin(a)*200 - 80,
          0.8, 4+Math.random()*5,
          kind === 'redeem' ? 'rgba(120,220,255,0.9)' : 'rgba(120,255,120,0.9)', 300);
  }
  showToast(kind === 'redeem' ? '💙 EXTRA LIFE USED — GO!' : '💚 FREE REVIVE — GO!',
            kind === 'redeem' ? '#4ad1ff' : '#57d94a');
}

/* =========================================================
   PHYSICS
   ========================================================= */
function physicsStep(dt){
  const car = world.car;
  if(!car || world.over) return;
  const def = car.def;

  const distM = world.distance;
  const ramp     = clamp(distM/2600, 0, 1);
  const powerSc  = 0.55 + ramp*1.15;
  const maxSpeed = 420 + ramp*980;
  const nitroMax = 4200;

  world.level = Math.floor(distM/250) + 1;
  const engM  = engMul();
  const gripM = gripMul();

  const cos = Math.cos(car.a), sin = Math.sin(car.a);
  let fx = 0, fy = GRAV, torque = 0;

  const spd = Math.hypot(car.vx, car.vy);
  const drag = 0.0036 * spd;
  fx -= car.vx * drag;
  fy -= car.vy * drag;

  const throttle = input.gas ? 1 : (input.brake ? -1 : 0);
  let grounded = 0;

  let slipMul = 1;
  if(currentSeason.muddy) slipMul = 0.65;
  else if(currentSeason.snow) slipMul = 0.72;

  for(let i=0;i<def.wheels.length;i++){
    const w  = def.wheels[i];
    const wx = car.x + w.lx*cos - w.ly*sin;
    const wy = car.y + w.lx*sin + w.ly*cos;
    const gy = terrainY(wx);
    const pen = (wy + w.r) - gy;

    if(pen > 0){
      grounded++;
      const slope = terrainSlope(wx);
      const inv = 1/Math.hypot(slope,1);
      const nx = slope*inv, ny = -inv;
      const tx = -ny, ty = nx;
      const rx = wx - car.x, ry = wy - car.y;
      const vpx = car.vx - car.av*ry;
      const vpy = car.vy + car.av*rx;
      const vn = vpx*nx + vpy*ny;
      const vt = vpx*tx + vpy*ty;
      let Fn = 650*pen - 2.5*vn;
      if(vn < -120){ Fn += (-vn - 120) * 14; }
      Fn = clamp(Fn, 0, 18000);
      let Ft = 0;
      if(throttle !== 0){
        let drive = def.engine * engM * throttle * powerSc;
        const over = (Math.abs(car.vx) - maxSpeed) / (maxSpeed*0.55);
        if(over > 0) drive *= Math.max(0, 1-over);
        Ft += drive;
      }
      Ft -= vt * 0.55;
      const maxF = def.mu * gripM * Fn * slipMul;
      Ft = clamp(Ft, -maxF, maxF);
      const Fx = nx*Fn + tx*Ft;
      const Fy = ny*Fn + ty*Ft;
      fx += Fx; fy += Fy;
      const driveFx = tx*Ft, driveFy = ty*Ft;
      torque += rx*(Fy-driveFy) - ry*(Fx-driveFx);
      torque += (rx*driveFy - ry*0.25*driveFx);
      car.spin[i] += vt * dt / w.r;
      if(Math.abs(vt) > 90 && Math.random() < 0.35){
        const dustCol = currentSeason.snow ? 'rgba(255,255,255,0.85)'
                       : currentSeason.muddy ? 'rgba(60,40,20,0.9)'
                       : currentSeason.id === 'highway' ? 'rgba(140,140,150,0.7)'
                       : currentSeason.id === 'cave' ? 'rgba(120,80,160,0.7)'
                       : 'rgba(150,110,70,0.85)';
        spawn(wx, gy-2, -vt*0.15 + (Math.random()-0.5)*60,
              -30 - Math.random()*70, 0.45 + Math.random()*0.35,
              3 + Math.random()*4, dustCol, 120);
      }
    }else{
      if(throttle > 0) car.spin[i] += 10*dt;
      else if(throttle < 0) car.spin[i] -= 10*dt;
    }
  }
  car.grounded = grounded;

  if(grounded > 0){
    const slope = terrainSlope(car.x);
    const inv = 1/Math.hypot(slope,1);
    const tx = inv, ty = slope*inv;
    const gTan = GRAV * ty;
    fx -= tx * gTan * 1.0;
    fy -= ty * gTan * 1.0;
  }

  if(world.nitro.active){
    world.nitro.timer -= dt;
    if(world.nitro.timer <= 0){ world.nitro.active = false; }
    else {
      car.vx += world.nitro.power * dt;
      if(Math.random() < 0.7){
        const bx = car.x - 62*cos + 6*sin;
        const by = car.y - 62*sin - 6*cos;
        spawn(bx, by, -260 - Math.random()*300, (Math.random()-0.5)*80,
              0.5, 5 + Math.random()*6, 'rgba(120,220,255,0.95)', -40);
      }
      if(world.shake < 8) world.shake = 8;
    }
  }

  if(grounded === 0){
    if(throttle > 0) torque -= 3.2;
    else if(throttle < 0) torque += 3.2;
  }

  car.vx += fx*dt;
  car.vy += fy*dt;
  car.av += (torque/def.inertia)*dt;
  car.av *= (1 - 0.5*dt);
  const hardCap = world.nitro.active ? nitroMax : maxSpeed*1.35;
  car.vx = clamp(car.vx, -380, hardCap);
  car.vy = clamp(car.vy, -1800, 1800);
  car.av = clamp(car.av, -12, 12);
  car.x += car.vx*dt;
  car.y += car.vy*dt;
  car.a += car.av*dt;
  car.squash *= 0.90;

  if(input.gas && world.fuel > 0 && !world.nitro.active){
    world.fuel = Math.max(0, world.fuel - dt*(1.9 + world.level*0.05));
    if(world.fuel <= 0) input.gas = false;
  }
  if(input.brake) world.fuel = Math.max(0, world.fuel - dt*0.4);

  if(input.gas && Math.random() < 0.4 && grounded > 0){
    const bx = car.x - 52*cos + 6*sin;
    const by = car.y - 52*sin - 6*cos;
    spawn(bx, by, -40 - Math.random()*60, -20 - Math.random()*40,
          0.6, 5 + Math.random()*4, 'rgba(80,80,80,0.5)', -25);
  }

  const dM = (car.x - START_X)/PX_PER_M;
  if(dM > world.distance) world.distance = dM;
  const kmh = Math.abs(car.vx)*0.36;
  if(kmh > world.topSpeed) world.topSpeed = kmh;

  const cycle = (world.distance / 4400) % 1;
  nightness = (1 - Math.cos(cycle * TAU)) / 2;
  if(currentSeason.alwaysDark) nightness = Math.max(nightness, 0.85);

  for(let i=0;i<objects.length;i++){
    const o = objects[i];
    if(o.got) continue;
    const dx = o.x - car.x, dy = o.y - car.y;
    if(dx*dx + dy*dy < 54*54){
      o.got = true;
      if(o.type === 'coin'){
        world.coinsEarned += o.v;
        save.coins += o.v;
        persist();
        Audio.coin();
        for(let k=0;k<8;k++){
          const a = Math.random()*TAU;
          spawn(o.x, o.y, Math.cos(a)*140, Math.sin(a)*140 - 60,
                0.5, 3+Math.random()*3, 'rgba(255,210,60,0.95)', 320);
        }
      }else{
        world.fuel = Math.min(world.maxFuel, world.fuel + world.maxFuel*0.34);
        for(let k=0;k<12;k++){
          const a = Math.random()*TAU;
          spawn(o.x, o.y, Math.cos(a)*150, Math.sin(a)*150 - 40,
                0.55, 3+Math.random()*3, 'rgba(90,230,110,0.95)', 300);
        }
      }
    }
  }

  const hx = car.x + (-2)*cos - (def.head)*sin;
  const hy = car.y + (-2)*sin + (def.head)*cos;
  if(hy > terrainY(hx) + 3){
    Audio.crash();
    handleCrash('CRASHED!');
    world.shake = 20;
    for(let k=0;k<30;k++){
      const a = Math.random()*TAU;
      spawn(hx, hy, Math.cos(a)*260, Math.sin(a)*260 - 100,
            0.8, 4+Math.random()*6, 'rgba(255,140,60,0.9)', 400);
    }
  }
  if(world.fuel <= 0 && Math.abs(car.vx) < 14 && car.grounded > 0){
    handleCrash('OUT OF FUEL!');
  }

  const speed = Math.abs(car.vx);
  const shouldBrakeSound = input.brake && (speed > 30 || (input.gas === false && speed > 10));
  if(shouldBrakeSound && !brakeSoundActive){
    Audio.startBrake();
    brakeSoundActive = true;
  } else if(!shouldBrakeSound && brakeSoundActive){
    Audio.stopBrake();
    brakeSoundActive = false;
  }
  if(brakeSoundActive) Audio.updateBrake(clamp(speed / 600, 0.25, 1));
}

/* =========================================================
   BOT AI
   ========================================================= */
function updateBot(dt){
  if(!world.bot || !world.car) return;
  if(paused || world.over) return;
  const b = world.bot;
  const def = b.def;
  const cos = Math.cos(b.a), sin = Math.sin(b.a);
  const ramp = clamp(world.distance/2600, 0, 1);
  const baseSpeed = 360 + ramp * 820;
  const target = baseSpeed * (b.speedMul || 1);
  const diff = target - b.vx;
  if(diff > 0) b.vx += diff * dt * 1.4;
  else b.vx += diff * dt * 2.2;
  b.vx += (Math.random()-0.5) * 40 * dt;
  b.vx = clamp(b.vx, -200, 2200 * (b.speedMul || 1));
  b.fuel = Math.max(0, b.fuel - dt * 0.8);
  b.x += b.vx * dt;
  const gy = terrainY(b.x);
  const w0 = def.wheels[0];
  const targetY = gy - (w0.ly + w0.r) - 6;
  b.y = lerp(b.y, targetY, 1 - Math.pow(0.0001, dt));
  const targetA = Math.atan(terrainSlope(b.x));
  b.a = lerp(b.a, targetA, 1 - Math.pow(0.02, dt));
  b.wheelSpin += (b.vx / (w0.r || 18)) * dt;
  b.spin = def.wheels.map(()=>b.wheelSpin);
  if(Math.abs(b.vx) > 150 && Math.random() < 0.3){
    const wx = b.x + w0.lx*cos;
    spawn(wx, gy-2, -b.vx*0.08 + (Math.random()-0.5)*40,
          -30 - Math.random()*50, 0.4, 3+Math.random()*3,
          'rgba(150,110,70,0.7)', 120);
  }
  for(let i=0;i<objects.length;i++){
    const o = objects[i];
    if(o.got) continue;
    const dx = o.x - b.x, dy = o.y - b.y;
    if(dx*dx + dy*dy < 50*50){
      o.got = true;
      for(let k=0;k<4;k++){
        const a = Math.random()*TAU;
        spawn(o.x, o.y, Math.cos(a)*120, Math.sin(a)*120 - 60,
              0.5, 3+Math.random()*2, 'rgba(255,210,60,0.85)', 320);
      }
    }
  }
}

/* =========================================================
   CRASH & GAME OVER
   ========================================================= */
function handleCrash(reason){
  if(world.over) return;
  if(world.distance < 2000 && save.matchesPlayed <= 2 && !world.freeReviveUsedThisMatch){
    world.freeReviveUsedThisMatch = true;
    reviveRun('free');
    return;
  }
  if(world.livesLeft > 0){
    world.livesLeft--;
    save.hasRedeemedLife = false;
    persist();
    reviveRun('redeem');
    return;
  }
  gameOver(reason);
}

function gameOver(reason){
  if(world.over) return;
  world.over = true;
  world.reason = reason;
  if(world.shake <= 0) world.shake = 12;
  Audio.stopBrake();
  brakeSoundActive = false;

  const bonus = Math.floor(world.distance * 0.6 * coinMul);
  save.coins += bonus;
  world.coinsEarned += bonus;
  if(world.distance > save.best) save.best = Math.floor(world.distance);

  let gmPrize = null;
  if(world.distance >= 2000000){
    const gmRoll = Math.random();
    if(gmRoll < 0.5){
      const coins = 50000 + Math.floor(Math.random()*150000);
      save.coins += coins;
      gmPrize = { type:'coins', amount: coins };
    } else if(gmRoll < 0.75){
      const keys = ['engine','grip','fuel','nitro'];
      const k = keys[Math.floor(Math.random()*keys.length)];
      if(save.upgrades[k] < 5){
        save.upgrades[k]++;
        gmPrize = { type:'upgrade', stat: k };
      } else {
        const coins = 120000;
        save.coins += coins;
        gmPrize = { type:'coins', amount: coins };
      }
    } else {
      const coins = 250000;
      save.coins += coins;
      gmPrize = { type:'coins', amount: coins };
    }
    save.gmRewardsClaimed++;
  }
  world.gmPrize = gmPrize;

  save.profile.history.unshift({
    dist: Math.floor(world.distance),
    coins: world.coinsEarned,
    diff: world.difficultyId,
    speed: Math.round(world.topSpeed),
    date: Date.now(),
    rank: getRank(save.best) ? getRank(save.best).name : null,
    map: currentSeason.name
  });
  if(save.profile.history.length > 30) save.profile.history.length = 30;

  persist();
  world.captureNextFrame = true;
}

function drawWheel(x,y,r,spin,squash){
  const sx = 1 + (squash||0);
  const sy = 1 - (squash||0)*0.65;
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(sx, sy);
  ctx.beginPath(); ctx.arc(0,0,r,0,TAU);
  ctx.fillStyle = '#101010'; ctx.fill();
  ctx.save();
  ctx.rotate(spin);
  ctx.strokeStyle = '#262626';
  ctx.lineWidth = Math.max(2, r*0.16);
  for(let i=0;i<12;i++){
    const a = i*TAU/12;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r*0.76, Math.sin(a)*r*0.76);
    ctx.lineTo(Math.cos(a)*r*0.99, Math.sin(a)*r*0.99);
    ctx.stroke();
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(0,0,r*0.58,0,TAU);
  const rg = ctx.createRadialGradient(-r*0.2,-r*0.2,r*0.1, 0,0,r*0.6);
  rg.addColorStop(0,'#eef3f6');
  rg.addColorStop(1,'#9aa6ad');
  ctx.fillStyle = rg; ctx.fill();
  ctx.strokeStyle = '#6d787f'; ctx.lineWidth = 2; ctx.stroke();
  ctx.save();
  ctx.rotate(spin);
  ctx.strokeStyle = '#7d888f';
  ctx.lineWidth = Math.max(2, r*0.13);
  for(let i=0;i<5;i++){
    const a = i*TAU/5;
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(a)*r*0.5, Math.sin(a)*r*0.5);
    ctx.stroke();
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(0,0,r*0.18,0,TAU);
  ctx.fillStyle = '#525c62'; ctx.fill();
  ctx.beginPath(); ctx.arc(-r*0.3,-r*0.3,r*0.22,0,TAU);
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fill();
  ctx.restore();
}

function bodyPath(pts){
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}

  const riderLean = isChopper ? -0.05 : -0.10;

}

function drawSpacecraftBody(d){
  ctx.beginPath();
  ctx.moveTo(-70, 6);
  ctx.quadraticCurveTo(-72, -18, -46, -22);
  ctx.lineTo(-16, -32);
  ctx.quadraticCurveTo(0, -40, 20, -32);
  ctx.lineTo(52, -22);
  ctx.quadraticCurveTo(74, -16, 72, 6);
  ctx.lineTo(58, 18);
  ctx.lineTo(-58, 18);
  ctx.closePath();
  const g = ctx.createLinearGradient(0,-40,0,20);
  g.addColorStop(0, '#e8f0f8');
  g.addColorStop(0.5, d.body);
  g.addColorStop(1, d.bodyDark);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 3; ctx.stroke();

  ctx.fillStyle = 'rgba(120,220,255,0.85)';
  bodyPath([[-20,-26],[20,-26],[28,-10],[-28,-10]]); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-12,-24); ctx.lineTo(-4,-12); ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(-66,-6,20,14);
  ctx.fillRect(46,-6,22,14);

  ctx.fillStyle = d.bodyDark;
  bodyPath([[-72,-8],[-88,-20],[-72,-2]]); ctx.fill();
  bodyPath([[-72,2],[-88,14],[-72,8]]); ctx.fill();

  ctx.fillStyle = 'rgba(120,220,255,0.8)';
  ctx.beginPath(); ctx.arc(-76, 0, 6, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(-76, 0, 3, 0, TAU); ctx.fill();

  const fl = 0.7 + Math.random()*0.5;
  const fg = ctx.createLinearGradient(-80,0,-80-90*fl,0);
  fg.addColorStop(0, 'rgba(180,240,255,0.95)');
  fg.addColorStop(0.4, 'rgba(80,180,255,0.6)');
  fg.addColorStop(1, 'rgba(80,180,255,0)');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(-80,-6); ctx.lineTo(-80-90*fl, 0); ctx.lineTo(-80, 6); ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#fff3a8';
  ctx.beginPath(); ctx.arc(56,-14,4,0,TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,243,168,0.4)';
  ctx.beginPath(); ctx.arc(56,-14,8,0,TAU); ctx.fill();

  ctx.strokeStyle = '#88a0b8'; ctx.lineWidth = 2;
  for(let i=0;i<3;i++){
    const cx = -50 + i*18;
    ctx.beginPath(); ctx.arc(cx, -6, 4, 0, TAU); ctx.stroke();
  }
}

function drawTrackBand(d){
  const w0 = d.wheels[0], wN = d.wheels[d.wheels.length-1];
  const x0 = w0.lx - w0.r - 4;
  const x1 = wN.lx + wN.r + 4;
  const y0 = -w0.r - 6;
  const h  = w0.r*2 + 12;
  ctx.fillStyle = '#2a2f1c';
  rr(x0, y0, x1-x0, h, h/2); ctx.fill();
  ctx.strokeStyle = '#171a0f'; ctx.lineWidth = 4; ctx.stroke();
}

const BODY_DRAW = {
  jeep:drawJeepBody, buggy:drawBuggyBody, monster:drawMonsterBody,
  rally:drawRallyBody, tractor:drawTractorBody, sport:drawSportBody,
  truck:drawTruckBody, atv:drawAtvBody, hotrod:drawHotrodBody,
  tank:drawTankBody, limo:drawLimoBody, rocket:drawRocketBody,
  spacecraft:drawSpacecraftBody
};

function drawVehicleBody(d, spins, squash){
  const wh = d.wheels;
  const last = wh.length-1;
  const sq = squash||0;

  if(d.isBike){
    drawWheel(wh[0].lx, wh[0].ly, wh[0].r, spins[0]||0, sq);
    drawWheel(wh[last].lx, wh[last].ly, wh[last].r, spins[last]||0, sq);
    if(d.type === 'bike_sport') drawBikeBody(d, 'sport');
    else if(d.type === 'bike_cruiser') drawBikeBody(d, 'cruiser');
    else if(d.type === 'bike_dirt') drawBikeBody(d, 'dirt');
    else if(d.type === 'bike_turbo') drawBikeBody(d, 'turbo');
    else if(d.type === 'bike_chopper') drawBikeBody(d, 'chopper');
    else if(d.type === 'bike_rocket') drawBikeBody(d, 'rocket');
    return;
  }

  if(d.track) drawTrackBand(d);
  for(let i=0;i<last;i++) drawWheel(wh[i].lx, wh[i].ly, wh[i].r, spins[i]||0, sq);
  const fn = BODY_DRAW[d.type];
  if(fn) fn(d);
  drawWheel(wh[last].lx, wh[last].ly, wh[last].r, spins[last]||0, sq);
}

/* =========================================================
   SKY / SEASONS / DAY-NIGHT
   ========================================================= */
function currentSky(){
  const sd = currentSeason.skyDay;
  const NIGHT = { top:[8,12,35], mid:[20,28,60], bot:[40,48,85], sun:[220,225,245] };
  return {
    top: mixC(sd.top, NIGHT.top, nightness),
    mid: mixC(sd.mid, NIGHT.mid, nightness),
    bot: mixC(sd.bot, NIGHT.bot, nightness),
    sun: mixC(sd.sun, NIGHT.sun, nightness)
  };
}

function drawSky(){
  /* Cave has its own sky */
  if(currentSeason.id === 'cave'){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0a0612');
    g.addColorStop(0.5,'#1a1025');
    g.addColorStop(1,'#2a1535');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
    /* Glowing crystals */
    for(let i=0;i<40;i++){
      const cx = (hash(i*2.3)*W + cam.x*0.08) % W;
      const cy = hash(i*3.1)*H*0.75 + 30;
      const sz = 1.5 + hash(i*5.7)*4;
      const col = ['#ff60c0','#60d0ff','#ffc060','#b060ff','#80ffd0'][i%5];
      ctx.fillStyle = col;
      ctx.globalAlpha = 0.35 + hash(i*7.3)*0.55;
      ctx.beginPath(); ctx.arc(cx, cy, sz, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    return;
  }

  const S = currentSky();
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,   rgb(S.top));
  g.addColorStop(0.5, rgb(S.mid));
  g.addColorStop(1,   rgb(S.bot));
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  if(nightness > 0.25){
    const alpha = clamp((nightness-0.25)/0.75, 0, 1);
    ctx.fillStyle = `rgba(255,255,255,${alpha*0.9})`;
    for(let i=0;i<80;i++){
      const sx2 = hash(i*1.31) * W;
      const sy2 = hash(i*2.17) * H*0.55;
      const sz = 0.6 + hash(i*3.7)*1.6;
      const tw = 0.5 + 0.5*Math.sin(performance.now()*0.002 + i*1.7);
      ctx.globalAlpha = alpha * tw;
      ctx.beginPath(); ctx.arc(sx2, sy2, sz, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  const sx = W*0.80, sy = H*0.15;
  const glow = ctx.createRadialGradient(sx,sy,4, sx,sy, Math.min(W,H)*0.30);
  glow.addColorStop(0, rgb(S.sun, 0.95));
  glow.addColorStop(0.25, rgb(S.sun, 0.35));
  glow.addColorStop(1, rgb(S.sun, 0));
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(sx,sy, Math.min(W,H)*0.30, 0, TAU); ctx.fill();
  ctx.fillStyle = rgb(S.sun);
  ctx.beginPath(); ctx.arc(sx, sy, Math.min(W,H)*0.055, 0, TAU); ctx.fill();
  if(nightness > 0.5){
    ctx.fillStyle = `rgba(180,180,200,${(nightness-0.5)*1.4})`;
    ctx.beginPath(); ctx.arc(sx-6, sy-5, 6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+8, sy+2, 4, 0, TAU); ctx.fill();
  }
}

/* Cave ceiling (drawn on top of sky, in screen space) */
function drawCaveCeiling(){
  if(currentSeason.id !== 'cave') return;
  /* Ceiling base */
  ctx.fillStyle = '#0a0610';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  for(let x=0; x<=W; x+=30){
    const wx = x + cam.x*0.25;
    const h = 45 + Math.sin(wx*0.007)*28 + Math.sin(wx*0.021+1.2)*18;
    ctx.lineTo(x, h);
  }
  ctx.lineTo(W, 0);
  ctx.closePath();
  ctx.fill();

  /* Stalactites */
  ctx.fillStyle = '#150a20';
  for(let i=0;i<16;i++){
    const px = ((i * 170 + cam.x*0.25) % (W + 220)) - 110;
    const len = 60 + hash(i*3.7) * 110;
    const width = 28 + hash(i*5.1) * 42;
    ctx.beginPath();
    ctx.moveTo(px - width, 0);
    ctx.lineTo(px, len);
    ctx.lineTo(px + width, 0);
    ctx.closePath();
    ctx.fill();
    /* Highlight edge */
    ctx.fillStyle = 'rgba(120,80,160,0.15)';
    ctx.beginPath();
    ctx.moveTo(px - width*0.4, 0);
    ctx.lineTo(px, len*0.9);
    ctx.lineTo(px - width*0.2, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#150a20';
  }
}

function cloudShape(x,y,s){
  ctx.beginPath();
  ctx.arc(x,y,24*s,0,TAU);
  ctx.arc(x+27*s,y-13*s,31*s,0,TAU);
  ctx.arc(x+58*s,y,22*s,0,TAU);
  ctx.arc(x+28*s,y+11*s,26*s,0,TAU);
  ctx.fill();
}
function drawClouds(){
  if(currentSeason.id === 'cave') return;
  const off = -cam.x*0.10;
  const span = W + 800;
  ctx.fillStyle = `rgba(255,255,255,${0.85*(1-nightness*0.75)})`;
  for(let i=0;i<10;i++){
    let x = ((i*380 + off) % span + span) % span - 400;
    const y = 40 + (i%4)*70 + Math.sin(i*1.7)*24 - cam.y*0.03;
    const s = 0.6 + (i%3)*0.3;
    cloudShape(x, y, s);
  }
  ctx.fillStyle = `rgba(255,255,255,${0.45*(1-nightness*0.75)})`;
  const off2 = -cam.x*0.20;
  for(let i=0;i<8;i++){
    let x = ((i*470 + off2) % span + span) % span - 400;
    const y = 130 + (i%3)*80;
    cloudShape(x, y, 0.45 + (i%4)*0.22);
  }
}
function drawBirds(){
  if(nightness > 0.55) return;
  if(currentSeason.rain) return;
  if(currentSeason.id === 'cave') return;
  const t = performance.now()*0.001;
  ctx.strokeStyle = `rgba(40,50,60,${0.55*(1-nightness*1.5)})`;
  ctx.lineWidth = 2;
  for(let i=0;i<5;i++){
    const bx = ((i*340 - cam.x*0.14 + t*22) % (W+600) + W+600) % (W+600) - 300;
    const by = 90 + i*42 + Math.sin(t*0.9 + i)*14 - cam.y*0.05;
    const f  = Math.sin(t*7 + i*1.4)*7;
    ctx.beginPath();
    ctx.moveTo(bx-9, by+f);
    ctx.lineTo(bx,   by-3);
    ctx.lineTo(bx+9, by+f);
    ctx.stroke();
  }
}
function drawRain(){
  if(!currentSeason.rain) return;
  const t = performance.now()*0.001;
  ctx.strokeStyle = `rgba(160,180,200,${0.5*(1-nightness*0.5)})`;
  ctx.lineWidth = 2;
  for(let i=0;i<120;i++){
    const rx = (hash(i*1.3)*W + t*400) % W;
    const ry = (hash(i*2.7)*H + t*900) % H;
    ctx.beginPath();
    ctx.moveTo(rx, ry);
    ctx.lineTo(rx - 4, ry + 16);
    ctx.stroke();
  }
}
function drawFallingLeaves(){
  if(!currentSeason.leaves) return;
  const t = performance.now()*0.001;
  for(let i=0;i<28;i++){
    const lx = (hash(i*3.1)*W + t*60 + Math.sin(t*2 + i)*30) % (W+80) - 40;
    const ly = (hash(i*5.7)*H + t*140) % (H+40) - 20;
    const rot = t*2 + i;
    const col = ['#c96020','#d99a30','#8a3a10','#e0a040'][i%4];
    ctx.save();
    ctx.translate(lx, ly);
    ctx.rotate(rot);
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.ellipse(0, 0, 8, 4, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}
function drawParallaxHills(){
  if(currentSeason.id === 'cave') return;
  const S = currentSky();
  const mixBase = currentSeason.snow ? [240,245,255]
                 : currentSeason.muddy ? [90,80,70]
                 : currentSeason.id === 'highway' ? [160,170,180]
                 : [150,205,195];
  const mixBase2 = currentSeason.snow ? [200,215,235]
                  : currentSeason.muddy ? [60,55,50]
                  : currentSeason.id === 'highway' ? [120,130,145]
                  : [118,180,168];
  const layers = [
    { col: rgb(mixC(mixBase, [255,255,255], 0.25*(1-nightness))), amp:76, base:0.585, par:0.14, f1:0.0009, f2:0.0033 },
    { col: rgb(mixBase), amp:58, base:0.645, par:0.26, f1:0.0015, f2:0.0048 },
    { col: rgb(mixBase2), amp:44, base:0.700, par:0.40, f1:0.0023, f2:0.0062 }
  ];
  for(const L of layers){
    ctx.fillStyle = L.col;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for(let x=0;x<=W;x+=12){
      const wx = x + cam.x*L.par;
      const y  = H*L.base - cam.y*0.07
               + Math.sin(wx*L.f1)*L.amp
               + Math.sin(wx*L.f2+1.7)*L.amp*0.42;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  }
}
function drawTree(x, baseY, s){
  const h = 62*s;
  ctx.fillStyle = currentSeason.treeTrunk;
  ctx.fillRect(x-4*s, baseY-h*0.55, 8*s, h*0.55);
  const greens = currentSeason.treeGreens.map(c => nightness > 0.5 ? mixC(hexToRgb(c), [20,30,40], 0.7) : hexToRgb(c));
  for(let i=0;i<3;i++){
    const r = (26 - i*5)*s;
    const cy = baseY - h*0.55 - i*16*s;
    ctx.fillStyle = rgb(greens[i]);
    ctx.beginPath();
    ctx.moveTo(x-r, cy); ctx.lineTo(x, cy - 26*s); ctx.lineTo(x+r, cy);
    ctx.closePath(); ctx.fill();
  }
  if(currentSeason.snow){
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for(let i=0;i<3;i++){
      const r = (26 - i*5)*s;
      const cy = baseY - h*0.55 - i*16*s;
      ctx.beginPath();
      ctx.moveTo(x-r*0.7, cy-4*s); ctx.lineTo(x, cy - 24*s); ctx.lineTo(x+r*0.7, cy-4*s);
      ctx.closePath(); ctx.fill();
    }
  }
  if(currentSeason.flowers){
    ctx.fillStyle = '#ff8ab8';
    for(let i=0;i<4;i++){
      const fx = x + (Math.random()-0.5)*40*s;
      const fy = baseY + Math.random()*10;
      ctx.beginPath(); ctx.arc(fx, fy, 2.5, 0, TAU); ctx.fill();
    }
  }
}
function drawStreetlight(x, baseY, s){
  /* Pole */
  ctx.fillStyle = '#5a5a65';
  ctx.fillRect(x-2*s, baseY-70*s, 4*s, 70*s);
  /* Arm */
  ctx.fillStyle = '#7a7a88';
  ctx.fillRect(x-2*s, baseY-72*s, 18*s, 5*s);
  /* Lamp housing */
  ctx.fillStyle = '#4a4a55';
  rr(x+12*s, baseY-78*s, 12*s, 10*s, 3*s); ctx.fill();
  /* Glow */
  ctx.fillStyle = 'rgba(255,245,180,0.9)';
  ctx.beginPath(); ctx.arc(x+18*s, baseY-68*s, 3.5*s, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,245,180,0.25)';
  ctx.beginPath(); ctx.arc(x+18*s, baseY-68*s, 12*s, 0, TAU); ctx.fill();
}
function drawStalagmite(x, baseY, s){
  ctx.fillStyle = '#3a2040';
  ctx.beginPath();
  ctx.moveTo(x-12*s, baseY);
  ctx.lineTo(x-4*s, baseY-24*s);
  ctx.lineTo(x, baseY-32*s);
  ctx.lineTo(x+4*s, baseY-24*s);
  ctx.lineTo(x+12*s, baseY);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(180,120,200,0.2)';
  ctx.beginPath();
  ctx.moveTo(x-6*s, baseY-8*s);
  ctx.lineTo(x-2*s, baseY-24*s);
  ctx.lineTo(x, baseY-20*s);
  ctx.closePath();
  ctx.fill();
}
function drawRock(x, baseY, s){
  const rockCol = currentSeason.snow ? '#8890a0'
                : currentSeason.muddy ? '#3a3028'
                : currentSeason.id === 'cave' ? '#2a2030'
                : currentSeason.id === 'highway' ? '#5a5a65'
                : (nightness > 0.5 ? '#3a4048' : '#6c737b');
  ctx.fillStyle = rockCol;
  ctx.beginPath();
  ctx.moveTo(x-16*s, baseY);
  ctx.lineTo(x-9*s, baseY-13*s);
  ctx.lineTo(x+3*s,  baseY-17*s);
  ctx.lineTo(x+14*s, baseY-8*s);
  ctx.lineTo(x+17*s, baseY);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath();
  ctx.moveTo(x-9*s, baseY-13*s);
  ctx.lineTo(x+3*s, baseY-17*s);
  ctx.lineTo(x+1*s, baseY-9*s);
  ctx.closePath(); ctx.fill();
}
function drawSign(x, baseY, meters){
  ctx.fillStyle = '#4a4a4a';
  ctx.fillRect(x-3, baseY-58, 6, 58);
  ctx.fillStyle = '#f5f7fa';
  rr(x-44, baseY-92, 88, 38, 8); ctx.fill();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#c0392b';
  ctx.font = 'bold 17px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(meters + ' m', x, baseY-72);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}
function drawScenery(){
  const left  = cam.x - 200;
  const right = cam.x + W + 200;
  const isHighway = currentSeason.id === 'highway';
  const isCave = currentSeason.id === 'cave';

  const tStep = isHighway ? 300 : 240;
  for(let x = Math.floor(left/tStep)*tStep; x < right; x += tStep){
    const h1 = hash(x*0.0173);
    if(h1 < 0.42 && !isHighway) continue;
    const px = x + hash2(x*0.031)*120;
    const s  = 0.75 + hash(px*0.011)*0.7;
    if(isHighway) drawStreetlight(px, terrainY(px)+4, 1.0);
    else if(isCave) drawStalagmite(px, terrainY(px)+4, s);
    else drawTree(px, terrainY(px)+4, s);
  }

  if(!isHighway){
    const rStep = 130;
    for(let x = Math.floor(left/rStep)*rStep; x < right; x += rStep){
      const h1 = hash(x*0.0431);
      if(h1 < 0.72) continue;
      const px = x + hash2(x*0.02)*80;
      drawRock(px, terrainY(px)+6, 0.7 + hash(px*0.05)*0.8);
    }
  }

  const signStep = 500*PX_PER_M;
  for(let m = Math.floor(left/signStep)*500; m*PX_PER_M < right; m += 500){
    if(m <= 0) continue;
    const x = START_X + m*PX_PER_M;
    if(x < left || x > right) continue;
    drawSign(x, terrainY(x)+6, m);
  }
}
function drawTerrain(){
  const left  = cam.x - 140;
  const right = cam.x + W + 140;
  ctx.beginPath();
  ctx.moveTo(left, terrainY(left));
  for(let x=left; x<=right; x+=8) ctx.lineTo(x, terrainY(x));
  ctx.lineTo(right, cam.y + H + 1200);
  ctx.lineTo(left,  cam.y + H + 1200);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, cam.y + H*0.05, 0, cam.y + H*1.0);
  const gnd = currentSeason.ground;
  if(nightness > 0.5){
    g.addColorStop(0, rgb(mixC(hexToRgb(gnd[0]), [15,15,25], 0.75)));
    g.addColorStop(0.35, rgb(mixC(hexToRgb(gnd[1]), [10,10,20], 0.8)));
    g.addColorStop(1, '#0a0806');
  } else {
    g.addColorStop(0, gnd[0]);
    g.addColorStop(0.35, gnd[1]);
    g.addColorStop(1, gnd[2]);
  }
  ctx.fillStyle = g; ctx.fill();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  const grass1 = nightness > 0.5 ? mixC(hexToRgb(currentSeason.grass1), [15,25,15], 0.75) : hexToRgb(currentSeason.grass1);
  const grass2 = nightness > 0.5 ? mixC(hexToRgb(currentSeason.grass2), [25,35,20], 0.75) : hexToRgb(currentSeason.grass2);
  ctx.beginPath();
  ctx.moveTo(left, terrainY(left));
  for(let x=left; x<=right; x+=8) ctx.lineTo(x, terrainY(x));
  ctx.lineWidth = 15; ctx.strokeStyle = rgb(grass1); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(left, terrainY(left));
  for(let x=left; x<=right; x+=8) ctx.lineTo(x, terrainY(x));
  ctx.lineWidth = 7; ctx.strokeStyle = rgb(grass2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(left, terrainY(left));
  for(let x=left; x<=right; x+=8) ctx.lineTo(x, terrainY(x));
  ctx.lineWidth = 2.5; ctx.strokeStyle = currentSeason.grassHi; ctx.stroke();

  /* Highway lane markings */
  if(currentSeason.id === 'highway' && nightness < 0.6){
    ctx.save();
    ctx.strokeStyle = 'rgba(255,220,90,0.75)';
    ctx.lineWidth = 3;
    ctx.setLineDash([24, 32]);
    ctx.beginPath();
    let first = true;
    for(let x = left; x <= right; x += 10){
      const y = terrainY(x) + 2;
      if(first){ ctx.moveTo(x, y); first = false; }
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  ctx.strokeStyle = `rgba(${grass2[0]},${grass2[1]},${grass2[2]},0.75)`;
  ctx.lineWidth = 2;
  const tStep = 26;
  for(let x = Math.floor(left/tStep)*tStep; x < right; x += tStep){
    const h1 = hash(x*0.071);
    if(h1 < 0.45) continue;
    const y = terrainY(x) - 2;
    const len = 7 + h1*9;
    const sway = Math.sin(performance.now()*0.002 + x*0.02)*2.5;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x+2, y-len*0.6, x+sway, y-len);
    ctx.stroke();
  }

  if(currentSeason.snow){
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    for(let x = Math.floor(left/80)*80; x < right; x += 80){
      const y = terrainY(x) + 18;
      ctx.beginPath(); ctx.arc(x, y, 12, 0, TAU); ctx.fill();
    }
  }
  if(currentSeason.muddy){
    ctx.fillStyle = 'rgba(30,20,10,0.5)';
    for(let x = Math.floor(left/160)*160; x < right; x += 160){
      const y = terrainY(x) + 30;
      ctx.beginPath(); ctx.arc(x, y, 18, 0, TAU); ctx.fill();
    }
  }
  if(currentSeason.id === 'cave'){
    /* Purple glow spots on terrain */
    ctx.fillStyle = 'rgba(180,80,220,0.22)';
    for(let x = Math.floor(left/200)*200; x < right; x += 200){
      const y = terrainY(x) + 40;
      ctx.beginPath(); ctx.arc(x, y, 22, 0, TAU); ctx.fill();
    }
  }
}

function drawHeadlights(){
  if(nightness < 0.30) return;
  const intensity = clamp((nightness - 0.30) / 0.70, 0, 1);
  const cars = [];
  if(world.car) cars.push(world.car);
  if(world.bot) cars.push(world.bot);
  for(const car of cars){
    const cos = Math.cos(car.a), sin = Math.sin(car.a);
    const hx = car.x + 54*cos - (-2)*sin;
    const hy = car.y + 54*sin + (-2)*cos;
    const coneLen = 460;
    const spread = 0.42;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(hx, hy, 6, hx, hy, coneLen);
    g.addColorStop(0,    `rgba(255,240,180,${0.75*intensity})`);
    g.addColorStop(0.35, `rgba(255,235,170,${0.28*intensity})`);
    g.addColorStop(1,    'rgba(255,235,170,0)');
    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.lineTo(hx + Math.cos(car.a - spread)*coneLen, hy + Math.sin(car.a - spread)*coneLen);
    ctx.lineTo(hx + Math.cos(car.a + spread)*coneLen, hy + Math.sin(car.a + spread)*coneLen);
    ctx.closePath();
    ctx.fillStyle = g; ctx.fill();
    ctx.restore();
  }
}

function drawGameOver(){
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0,0,W,H);
  const pw = Math.min(W*0.94, 760);
  const ph = Math.min(H*0.92, 560);
  const px = W/2 - pw/2;
  const py = H/2 - ph/2;

  g.addColorStop(1,'#0b1016');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = '#3d4f63'; ctx.lineWidth = 4; ctx.stroke();

  const D = DIFFICULTIES[world.difficultyId];
  const pad = 20;
  const btnH = 62;
  const btnY = py + ph - btnH - pad;
  const contentH = btnY - py - pad*2 - 40;

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff5252';
  ctx.font = 'bold 26px Arial';
  ctx.fillText(world.reason, W/2, py + 34);

  const wide = pw > 560;
  const imgAreaW = wide ? pw*0.45 - pad*1.5 : pw - pad*2;
  const imgAreaH = wide ? contentH : contentH*0.48;
  const imgX = px + pad;

  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 2;

  ctx.save();

  if(world.crashImg && world.crashImg.complete && world.crashImg.naturalWidth){
    const iw = world.crashImg.naturalWidth;
    const ih = world.crashImg.naturalHeight;
    const scl = Math.max(imgAreaW/iw, imgAreaH/ih);

    ctx.drawImage(world.crashImg, imgX + (imgAreaW-dw)/2, imgY + (imgAreaH-dh)/2, dw, dh);

  ctx.fillStyle = '#ffcf26';

  const statsY = wide ? py + 50 : py + 50 + contentH*0.48 + 14;
  const statsW = wide ? pw*0.55 - pad*1.5 : pw - pad*2;

  ctx.textAlign = 'left';

  ctx.font = 'bold 12px Arial';
  ctx.fillText('DISTANCE', statsX, statsY + 16);

function drawToast(){

  const t = toast.life/toast.max;
  const a = t > 0.85 ? (1-t)/0.15 : (t < 0.15 ? t/0.15 : 1);
  ctx.save();
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.font = 'bold 18px Arial';
  const tw = ctx.measureText(toast.msg).width + 44;
  const tx = W/2 - tw/2;
  const ty = H*0.30;
  ctx.fillStyle = 'rgba(0,0,0,0.85)';

  ctx.strokeStyle = toast.color; ctx.lineWidth = 2; ctx.stroke();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(toast.msg, W/2, ty + 26);

}

/* =========================================================
   MAPS SCREEN — with scrolling
   ========================================================= */
function drawMaps(t){
  uiButtons.length = 0;
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0d1420');
  g.addColorStop(1,'#0a0f16');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  /* Header */
  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.round(clamp(W*0.05, 26, 42)) + 'px Arial';
  ctx.fillText('MAPS', W/2, H*0.075);
  ctx.fillStyle = '#8fa2b5';
  ctx.font = 'bold 12px Arial';
  ctx.fillText('Scroll to browse • Buy to unlock environments', W/2, H*0.11);
  ctx.restore();

  /* Coins */
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  rr(W-232, 16, 216, 46, 12); ctx.fill();
  ctx.fillStyle = '#ffcf26';
  ctx.beginPath(); ctx.arc(W-202, 39, 12, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#c98a00'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px Arial';
  ctx.fillText(save.coins.toLocaleString(), W-180, 47);
  ctx.restore();

  /* ---- Scrollable content area ---- */
  const contentTop = H * 0.145;
  const contentBottom = H - 92;
  const contentH = contentBottom - contentTop;

  const cols = W > 720 ? 3 : (W > 460 ? 2 : 1);
  const cardW = Math.min(210, (W - 60 - (cols-1)*16) / cols);
  const cardH = 190;
  const gapX = 16;
  const gapY = 18;
  const totalRows = Math.ceil(SEASONS.length / cols);
  const totalContentH = totalRows * cardH + (totalRows-1) * gapY + 24;
  mapsScrollMax = Math.max(0, totalContentH - contentH);
  mapsScroll = clamp(mapsScroll, 0, mapsScrollMax);

  /* Clip scrolling region */
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, contentTop, W, contentH);
  ctx.clip();

  const totalW = cols * cardW + (cols-1) * gapX;
  const startX = W/2 - totalW/2;

  for(let i=0;i<SEASONS.length;i++){
    const s = SEASONS[i];
    const col = i % cols;
    const row = Math.floor(i / cols);
    const cx = startX + col * (cardW + gapX);
    const cy = contentTop + 12 + row * (cardH + gapY) - mapsScroll;

    if(cy + cardH < contentTop - 4 || cy > contentBottom + 4) continue;

    const visible = cy >= contentTop - 4 && cy + cardH <= contentBottom + 4;
    drawMapCard(cx, cy, cardW, cardH, s, save.ownedMaps[i], save.selectedMap === i, i, visible);
  }

  ctx.restore();

  /* Scrollbar */
  if(mapsScrollMax > 0){
    const sbX = W - 8;
    const sbTrackTop = contentTop + 6;
    const sbTrackH = contentH - 12;
    const sbH = Math.max(50, sbTrackH * (contentH / totalContentH));
    const sbY = sbTrackTop + (mapsScroll / mapsScrollMax) * (sbTrackH - sbH);
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    rr(sbX - 2, sbTrackTop, 6, sbTrackH, 3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    rr(sbX - 2, sbY, 6, sbH, 3); ctx.fill();
    ctx.restore();
  }

  /* Top & bottom fade hints when scrollable */
  if(mapsScroll > 4){
    const fg = ctx.createLinearGradient(0, contentTop, 0, contentTop+30);
    fg.addColorStop(0, 'rgba(13,20,32,0.9)');
    fg.addColorStop(1, 'rgba(13,20,32,0)');
    ctx.fillStyle = fg;
    ctx.fillRect(0, contentTop, W, 30);
    /* Arrow hint */
    ctx.save();
    ctx.globalAlpha = 0.6 + Math.sin(performance.now()*0.006)*0.3;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('▲', W/2, contentTop + 18);
    ctx.restore();
  }
  if(mapsScroll < mapsScrollMax - 4){
    const fg = ctx.createLinearGradient(0, contentBottom-30, 0, contentBottom);
    fg.addColorStop(0, 'rgba(13,20,32,0)');
    fg.addColorStop(1, 'rgba(13,20,32,0.9)');
    ctx.fillStyle = fg;
    ctx.fillRect(0, contentBottom-30, W, 30);
    ctx.save();
    ctx.globalAlpha = 0.6 + Math.sin(performance.now()*0.006)*0.3;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('▼', W/2, contentBottom - 6);
    ctx.restore();
  }

  /* Back button */
  drawUIButton('backMenu', W/2 - 100, H - 70, 200, 54, '◀ BACK', '#2c3a4d', '#fff');
  drawToast();
}

function drawMapCard(x, y, w, h, s, owned, selected, idx, visible){
  ctx.save();

  /* Background */
  rr(x, y, w, h, 16);
  const g = ctx.createLinearGradient(0, y, 0, y+h);
  g.addColorStop(0, rgb(s.skyDay.top));
  g.addColorStop(0.55, rgb(s.skyDay.mid));
  g.addColorStop(1, rgb(s.skyDay.bot));
  ctx.fillStyle = g; ctx.fill();

  /* Ground + hills preview */
  ctx.save();
  ctx.beginPath();
  rr(x, y, w, h, 16);
  ctx.clip();
  const gy = y + h - 56;
  /* Back hills */
  ctx.fillStyle = s.treeGreens[1];
  ctx.beginPath();
  ctx.moveTo(x, gy);
  ctx.quadraticCurveTo(x + w*0.3, gy - 34, x + w*0.55, gy);
  ctx.quadraticCurveTo(x + w*0.8, gy - 26, x + w, gy);
  ctx.lineTo(x + w, gy + 60);
  ctx.lineTo(x, gy + 60);
  ctx.closePath(); ctx.fill();
  /* Front hills */
  ctx.fillStyle = s.treeGreens[0];
  ctx.beginPath();
  ctx.moveTo(x, gy + 8);
  ctx.quadraticCurveTo(x + w*0.4, gy - 18, x + w*0.7, gy + 8);
  ctx.quadraticCurveTo(x + w*0.9, gy - 4, x + w, gy + 6);
  ctx.lineTo(x + w, gy + 60);
  ctx.lineTo(x, gy + 60);
  ctx.closePath(); ctx.fill();
  /* Ground strip */
  ctx.fillStyle = s.ground[0];
  ctx.fillRect(x, y + h - 22, w, 22);
  ctx.fillStyle = s.grass2;
  ctx.fillRect(x, y + h - 22, w, 4);
  ctx.fillStyle = s.grass1;
  ctx.fillRect(x, y + h - 18, w, 3);

  /* Sun or moon */
  ctx.fillStyle = rgb(s.skyDay.sun);
  ctx.beginPath();
  ctx.arc(x + w - 26, y + 26, 12, 0, TAU);
  ctx.fill();
  ctx.fillStyle = rgb(s.skyDay.sun, 0.3);
  ctx.beginPath();
  ctx.arc(x + w - 26, y + 26, 20, 0, TAU);
  ctx.fill();

  ctx.restore();

  /* Border */
  rr(x, y, w, h, 16);
  ctx.strokeStyle = selected ? '#ffcf26' : 'rgba(255,255,255,0.22)';
  ctx.lineWidth = selected ? 4 : 2;
  ctx.stroke();

  /* Icon + name */
  ctx.font = 'bold 34px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillText(s.icon, x + w/2 + 2, y + 52 + 2);
  ctx.fillStyle = '#fff';
  ctx.fillText(s.icon, x + w/2, y + 52);

  /* Name plate */
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  rr(x + 8, y + 78, w - 16, 34, 8); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px Arial';
  ctx.fillText(s.name, x + w/2, y + 95);
  ctx.fillStyle = '#ffffffcc';
  ctx.font = 'bold 10px Arial';
  ctx.fillText(s.desc, x + w/2, y + 110);

  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

  /* Badge / button */
  const bw = w - 24;
  const bh = 34;
  const bx = x + 12;
  const by = y + h - bh - 12;

  if(visible){
    uiButtons.push({ id:'map_'+idx, x:bx, y:by, w:bw, h:bh, enabled:true });
  }

  rr(bx, by, bw, bh, 10);
  if(owned){
    if(selected){
      ctx.fillStyle = '#57d94a'; ctx.fill();
      ctx.strokeStyle = '#0a3a0a'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#06300b';
      ctx.font = 'bold 13px Arial';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('✓ ACTIVE', bx + bw/2, by + bh/2 + 1);
    } else {
      ctx.fillStyle = '#2c3a4d'; ctx.fill();
      ctx.strokeStyle = '#57d94a'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px Arial';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('TAP TO USE', bx + bw/2, by + bh/2 + 1);
    }
  } else {
    const canBuy = save.coins >= s.price;
    ctx.fillStyle = canBuy ? '#ffcf26' : '#39414a'; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = canBuy ? '#3a2a00' : '#8b98a5';
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🪙 ' + s.price.toLocaleString(), bx + bw/2, by + bh/2 + 1);
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.restore();
}

   ========================================================= */
function drawGarage(t){
  uiButtons.length = 0;
  const floorY = H*0.53;
  const v = VEHICLES[save.selected];
  let g = ctx.createLinearGradient(0,0,0,floorY);
  g.addColorStop(0,'#131a23');
  g.addColorStop(1,'#2f3d4b');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,floorY);
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for(let x=0;x<W;x+=72){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,floorY); ctx.stroke(); }
  for(let y=0;y<floorY;y+=72){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  const winW = Math.min(W*0.50, 540);
  const winH = floorY*0.50;
  const winX = W/2 - winW/2;
  const winY = floorY*0.06;
  ctx.save();
  ctx.beginPath(); ctx.rect(winX,winY,winW,winH); ctx.clip();
  const S = currentSky();
  const sg = ctx.createLinearGradient(0,winY,0,winY+winH);
  sg.addColorStop(0, rgb(S.top));
  sg.addColorStop(0.55, rgb(S.mid));
  sg.addColorStop(1, rgb(S.bot));
  ctx.fillStyle = sg;
  ctx.fillRect(winX,winY,winW,winH);
  ctx.fillStyle = rgb(S.sun);
  ctx.beginPath(); ctx.arc(winX+winW*0.76, winY+winH*0.26, winH*0.14, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = '#0c1219'; ctx.lineWidth = 10;
  ctx.strokeRect(winX, winY, winW, winH);

  let fg = ctx.createLinearGradient(0,floorY,0,H);
  fg.addColorStop(0,'#4a5560');
  fg.addColorStop(1,'#161b21');
  ctx.fillStyle = fg;
  ctx.fillRect(0,floorY,W,H-floorY);
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 3;

  const wheelBottom = Math.max(...v.wheels.map(w=>w.ly+w.r));

  const carY = floorY - wheelBottom*scale;
  const floatY = Math.sin(t*1.6)*4;

  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(W/2, floorY+6, spanW*0.6*scale, 20*scale, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(W/2, carY + floatY);

  drawVehicleBody(v, [t*1.2, t*1.2], 0);
  ctx.restore();

  ctx.fillStyle = 'rgba(0,0,0,0.5)';

  ctx.font = 'bold 18px Arial';
  ctx.fillText('GARAGE', 32, 44);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';

  drawUIButton('backMenu', 148, 14, 100, 46, '◀ BACK', '#2c3a4d', '#fff');

  const dotN = VEHICLES.length;
  const dotW = 16;

  const dy  = floorY + 12;
  for(let i=0;i<dotN;i++){
    const dx = dx0 + i*dotW + dotW/2;
    uiButtons.push({id:'sel_'+i, x:dx-7, y:dy-7, w:14, h:14, enabled:true});
    ctx.beginPath();
    ctx.arc(dx, dy, i===save.selected ? 6 : 4, 0, TAU);
    ctx.fillStyle = i===save.selected ? '#ffcf26'
                  : (save.owned[i] ? '#57d94a' : 'rgba(255,255,255,0.22)');
    ctx.fill();
  }

  const panelY = H*0.60;
  const panelH = H - panelY;
  const padX = Math.max(12, W*0.03);
  const pg = ctx.createLinearGradient(0,panelY,0,H);
  pg.addColorStop(0,'rgba(10,15,21,0.95)');
  pg.addColorStop(1,'rgba(4,7,10,0.99)');
  ctx.fillStyle = pg;
  ctx.fillRect(0,panelY,W,panelH);
  ctx.strokeStyle = 'rgba(255,255,255,0.13)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,panelY); ctx.lineTo(W,panelY); ctx.stroke();

  const row1H = panelH*0.42;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.round(clamp(W*0.024,15,24)) + 'px Arial';
  ctx.fillText(v.name, padX, panelY + 26);
  ctx.fillStyle = '#8fa2b5';
  ctx.font = '12px Arial';
  ctx.fillText(v.desc, padX, panelY + 44);
  ctx.fillStyle = '#5c6f80';
  ctx.font = 'bold 11px Arial';
  ctx.fillText((save.selected+1) + ' / ' + VEHICLES.length, padX, panelY + 62);

  const statW = Math.min(160, W*0.19);
  const statY = panelY + 70;
  let si = 0;
  for(const key in v.stats){
    const sy = statY + si*13;
    ctx.fillStyle = '#9fb0c0';
    ctx.font = 'bold 9px Arial';
    ctx.fillText(key, padX, sy+8);
    rr(padX+48, sy, statW, 8, 4);
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fill();
    const val = v.stats[key];
    const col = val>0.75 ? '#57d94a' : (val>0.5 ? '#ffcf26' : '#ff8a4a');
    rr(padX+48, sy, statW*val, 8, 4);
    ctx.fillStyle = col; ctx.fill();
    si++;
  }

  const btnW = Math.min(260, W*0.32);
  const btnH = Math.min(60, row1H - 16);
  const btnX = W - padX - btnW;
  const btnY = panelY + (row1H - btnH)/2;
  const owned = save.owned[save.selected];
  if(!owned){
    const canBuy = save.coins >= v.price;
    drawUIButton('buy', btnX, btnY, btnW, btnH,
      canBuy ? ('BUY  ' + v.price.toLocaleString())
             : ('NEED ' + v.price.toLocaleString()),
      canBuy ? '#ffcf26' : '#39414a',
      canBuy ? '#3a2a00' : '#8b98a5',
      canBuy);
  }else{
    drawUIButton('drive', btnX, btnY, btnW, btnH, '▶  DRIVE', '#4ad14a', '#06300b', true);
  }

  const row2Y = panelY + row1H + 4;
  const row2H = panelH - row1H - 8;
  const gap2 = Math.max(6, W*0.008);
  const cardW = (W - padX*2 - gap2*3) / 4;
  const cardH = row2H - 8;
  for(let i=0;i<UPGRADES.length;i++){
    const u = UPGRADES[i];
    const cx = padX + i*(cardW + gap2);
    const cy = row2Y + 4;
    drawUpgradeCard(cx, cy, cardW, cardH, u);
  }
}
function drawUpgradeCard(x, y, w, h, u){
  const lv = save.upgrades[u.id];
  const maxed = lv >= u.max;
  const cost = upgradeCost(u.id, lv);
  const canAfford = save.coins >= cost;
  rr(x, y, w, h, 10);
  const g = ctx.createLinearGradient(0,y,0,y+h);
  if(maxed){ g.addColorStop(0,'rgba(60,120,60,0.7)'); g.addColorStop(1,'rgba(20,60,25,0.85)'); }
  else if(canAfford){ g.addColorStop(0,'rgba(50,65,80,0.95)'); g.addColorStop(1,'rgba(22,30,40,0.95)'); }
  else { g.addColorStop(0,'rgba(40,45,55,0.9)'); g.addColorStop(1,'rgba(18,22,28,0.95)'); }
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = maxed ? '#57d94a'
                  : (canAfford ? 'rgba(255,207,38,0.7)' : 'rgba(255,255,255,0.12)');
  ctx.lineWidth = 2; ctx.stroke();
  const iconR = Math.min(w, h)*0.17;
  drawUpgradeIcon(u.id, x + w/2, y + h*0.28, iconR);
  ctx.fillStyle = maxed ? '#b8ffb0' : '#fff';
  ctx.font = 'bold ' + Math.round(clamp(w*0.11, 8, 12)) + 'px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(u.name, x+w/2, y+h*0.52);
  const dotN = u.max;
  const dotR = Math.max(2, w*0.022);
  const dotGap = dotR*2.6;
  const dotW2 = dotN*dotGap - dotGap;
  const dotX0 = x + w/2 - dotW2/2;
  const dotY = y + h*0.68;
  for(let i=0;i<dotN;i++){
    const dx = dotX0 + i*dotGap;
    ctx.beginPath();
    ctx.arc(dx, dotY, i<lv ? dotR+1 : dotR-1, 0, TAU);
    ctx.fillStyle = i<lv ? '#57d94a' : 'rgba(255,255,255,0.2)';
    ctx.fill();
  }
  if(maxed){
    ctx.fillStyle = '#57d94a';
    ctx.font = 'bold ' + Math.round(clamp(w*0.11, 8, 12)) + 'px Arial';
    ctx.fillText('MAX', x+w/2, y+h*0.88);
  } else {
    ctx.fillStyle = canAfford ? '#ffcf26' : '#ff7a6a';
    ctx.font = 'bold ' + Math.round(clamp(w*0.10, 8, 11)) + 'px Arial';
    ctx.fillText(cost.toLocaleString(), x+w/2, y+h*0.88);
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  uiButtons.push({id:'upg_'+u.id, x, y, w, h, enabled: !maxed});
}
function drawUpgradeIcon(id, x, y, r){
  ctx.save();
  ctx.translate(x,y);
  const col = id==='nitro' ? '#ff6b00' : '#ffcf26';
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.lineWidth = Math.max(2, r*0.16);
  ctx.lineCap = 'round';
  if(id === 'engine'){
    ctx.beginPath(); ctx.arc(0,0,r*0.58,0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,r*0.22,0,TAU); ctx.fill();
    for(let i=0;i<6;i++){
      const a = i*TAU/6;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r*0.6, Math.sin(a)*r*0.6);
      ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
      ctx.stroke();
    }
  } else if(id === 'grip'){
    ctx.beginPath(); ctx.arc(0,0,r*0.88,0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,r*0.42,0,TAU); ctx.stroke();
    for(let i=0;i<4;i++){
      const a = i*TAU/4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r*0.42, Math.sin(a)*r*0.42);
      ctx.lineTo(Math.cos(a)*r*0.88, Math.sin(a)*r*0.88);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0,0,r*0.14,0,TAU); ctx.fill();
  } else if(id === 'fuel'){
    ctx.beginPath();
    ctx.rect(-r*0.55, -r*0.7, r*1.1, r*1.5); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-r*0.22, -r*0.7);
    ctx.lineTo(-r*0.22, -r*1.0);
    ctx.lineTo(r*0.22, -r*1.0);
    ctx.lineTo(r*0.22, -r*0.7);
    ctx.stroke();
    ctx.fillRect(-r*0.32, -r*0.2, r*0.64, r*0.85);
  } else if(id === 'nitro'){
    ctx.beginPath();
    ctx.moveTo(0, r*1.05);
    ctx.quadraticCurveTo(-r*0.85, r*0.2, -r*0.30, -r*0.55);
    ctx.quadraticCurveTo(-r*0.10, -r*0.15, 0, -r*1.05);
    ctx.quadraticCurveTo(r*0.10, -r*0.15, r*0.30, -r*0.55);
    ctx.quadraticCurveTo(r*0.85, r*0.2, 0, r*1.05);
    ctx.fill();
  }
  ctx.lineCap = 'butt';
  ctx.restore();
}
function drawShelf(x,y,w,h){
  ctx.fillStyle = '#232b33'; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle = '#12171c'; ctx.lineWidth = 3; ctx.strokeRect(x,y,w,h);
  for(let i=1;i<4;i++){
    ctx.fillStyle = '#333d47';
    ctx.fillRect(x, y + h*i/4, w, 6);
  }
  ctx.fillStyle = '#e02020'; ctx.fillRect(x+12, y+12, 24, 28);
  ctx.fillStyle = '#2f6fd0'; ctx.fillRect(x+46, y+16, 20, 24);
  ctx.fillStyle = '#57d94a'; ctx.fillRect(x+74, y+10, 22, 30);
}
function drawTireStack(x, floorY, n){
  for(let i=0;i<n;i++){
    const r = 44 - i*3;
    const y = floorY - 18 - i*30;
    ctx.beginPath(); ctx.ellipse(x,y,r,r*0.42,0,0,TAU);
    ctx.fillStyle = '#181818'; ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(x,y,r*0.5,r*0.21,0,0,TAU);
    ctx.fillStyle = '#484848'; ctx.fill();
  }
}
function drawArrowButton(id,x,y,dir){
  const r = 30;
  uiButtons.push({id, x:x-r, y:y-r, w:r*2, h:r*2, enabled:true});
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  ctx.fillStyle = 'rgba(12,18,25,0.78)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + dir*11, y-14);
  ctx.lineTo(x - dir*11, y);
  ctx.lineTo(x + dir*11, y+14);
  ctx.closePath();
  ctx.fillStyle = '#ffcf26'; ctx.fill();
  ctx.restore();
}

  if(emojiPickerOpen){

function drawProfileStat(x, y, w, h, icon, label, value){
